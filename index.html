<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGB Neon</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

h1{
    font-size:4rem;
    text-align:center;
    animation: rgb 2s linear infinite;
}

@keyframes rgb{
    0%{
        color:red;
        text-shadow:0 0 10px red,0 0 20px red,0 0 40px red;
    }
    33%{
        color:lime;
        text-shadow:0 0 10px lime,0 0 20px lime,0 0 40px lime;
    }
    66%{
        color:blue;
        text-shadow:0 0 10px blue,0 0 20px blue,0 0 40px blue;
    }
    100%{
        color:red;
        text-shadow:0 0 10px red,0 0 20px red,0 0 40px red;
    }
}
</style>
</head>
<body>

<h1>🔥 Parrmine Ganteng Banget Jurr 🔥</h1>

</body>
</html>
